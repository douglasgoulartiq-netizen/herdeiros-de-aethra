<!doctype html><html lang="pt-BR"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><base href="../">
<title>Personagens — direção visual</title><link rel="stylesheet" href="src/personagens-arte.css">
<style>
body{margin:0;background:#101824;color:#e8ecf3;font:15px system-ui}header{position:sticky;top:0;background:#101824f5;padding:16px;z-index:1}h1{font-size:22px;margin:0 0 10px}button,select{padding:9px;background:#22344a;color:inherit;border:1px solid #56708c;border-radius:6px}nav{display:flex;gap:8px;flex-wrap:wrap}#gallery{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:12px;padding:16px}article{padding:12px;border:1px solid #3b4c61;border-radius:10px;background:linear-gradient(#1c2c3e,#121d29)}h2{font-size:16px;margin:0}p{font-size:13px;color:#b8c8d8}.body{height:230px;display:flex;justify-content:center;align-items:end;border-bottom:1px solid #51677f}.body img{height:220px;width:220px;object-fit:contain;image-rendering:pixelated}.portraits{display:flex;gap:12px;align-items:center;margin-top:8px}.portraits img{image-rendering:pixelated;background:#253952;border-radius:6px}.silhouette .body img{filter:brightness(0)}#status{padding:8px 0;color:#b5d6be}.sprite-wrap{height:220px;width:220px}#gallery .sprite-wrap img{width:100%;height:100%}
</style>
<header><h1>Personagens · arte oficial</h1><nav><button id="previous">Anterior</button><button id="next">Próximos 12</button><label><input id="silhouette" type="checkbox"> Silhueta</label><label><input id="reduce" type="checkbox"> Movimento reduzido</label><select id="pose" aria-label="Animação"><option value="">Repouso</option><option value="golpe-jogador">Ataque</option><option value="hit-flash">Impacto</option><option value="heroi-vitorioso">Vitória</option></select><button id="validate">Validar todas as imagens</button></nav><div id="status" role="status"></div></header><main id="gallery"></main><script type="module" src="tests/character-art-preview.js"></script></html>
